<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Tablette Lawrence Beignets</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="hidden">
  <div id="tablet">
    <div class="bezel">
      <div class="topbar">
        <div class="brand">🍩 LAWRENCE BEIGNETS</div>
        <div class="clock" id="clock">--:--</div>
      </div>

      <div class="screen" id="screen">
        <!-- Les vues sont injectées ici par app.js -->
      </div>

      <div class="navbar">
        <button id="btn-home" class="nav-btn" title="Accueil">🏠</button>
        <button id="btn-close" class="nav-btn" title="Fermer (Échap)">✕</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
